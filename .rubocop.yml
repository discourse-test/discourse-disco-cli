inherit_gem:
  rubocop-discourse-base:
    - stree-compat.yml
    - rubocop-rspec.yml

AllCops:
  TargetRubyVersion: "3.4"
  NewCops: enable

# stree-compat.yml doesn't include the layout cops; Discourse enables this one.
Layout/EmptyLineBetweenDefs:
  Enabled: true

Style/HashSyntax:
  EnforcedShorthandSyntax: always

Style/ModuleFunction:
  EnforcedStyle: forbidden

Style/EndlessMethod:
  EnforcedStyle: disallow

Style/Send:
  Enabled: true

# Autocorrects `unless x.include?(…)` to ActiveSupport's `exclude?`, which
# exists only on the types ActiveSupport patches. The cop is `Safe: false`
# anyway.
Style/InvertibleUnlessCondition:
  Enabled: false

# Constants (and classes) declared inside example groups are global — they leak
# across spec files and collide load-order-dependently. Use `let` for aliases
# and top-level (or stubbed) classes for test doubles.
RSpec/LeakyConstantDeclaration:
  Enabled: true

# Spec rules Discourse enables on top of rubocop-rspec.yml.
RSpec/EmptyLineAfterExample:
  Enabled: true

RSpec/EmptyLineAfterExampleGroup:
  Enabled: true

RSpec/EmptyLineAfterFinalLet:
  Enabled: true

RSpec/EmptyLineAfterHook:
  Enabled: true

RSpec/ExampleWording:
  Enabled: true

RSpec/RepeatedDescription:
  Enabled: true

RSpec/RepeatedExampleGroupDescription:
  Enabled: true

# Integration specs cover a workflow, not one class.
RSpec/DescribeClass:
  Exclude:
    - "**/spec/integration/**/*"
